name: invook

services:
  db:
    # Historical migrations require the vector extension before the latest schema removes it.
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invook}
      POSTGRES_DB: ${POSTGRES_DB:-invook}
    volumes:
      - invook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-invook}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-invook-local-secret}
    volumes:
      - invook-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set invook http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "invook/$${S3_BUCKET}"
    environment:
      S3_BUCKET: ${S3_BUCKET:-invook-mail}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-invook}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-invook-local-secret}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://invook:invook@db:5432/invook}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://invook:invook@db:5432/invook}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_GOOGLE_CLIENT_ID: ${BETTER_AUTH_GOOGLE_CLIENT_ID:-}
      BETTER_AUTH_GOOGLE_CLIENT_SECRET: ${BETTER_AUTH_GOOGLE_CLIENT_SECRET:-}
      GMAIL_GOOGLE_CLIENT_ID: ${GMAIL_GOOGLE_CLIENT_ID:-}
      GMAIL_GOOGLE_CLIENT_SECRET: ${GMAIL_GOOGLE_CLIENT_SECRET:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GOOGLE_PUBSUB_PUSH_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_AUDIENCE:-}
      GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PUBSUB_SUBSCRIPTION: ${GOOGLE_PUBSUB_SUBSCRIPTION:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      MEMORY_BATCH_PROVIDER: ${MEMORY_BATCH_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_BATCH_DEPLOYMENT: ${AZURE_OPENAI_BATCH_DEPLOYMENT:-}
      AZURE_OPENAI_BATCH_INPUT_TOKEN_LIMIT: ${AZURE_OPENAI_BATCH_INPUT_TOKEN_LIMIT:-}
      AZURE_OPENAI_WEBHOOK_SECRET: ${AZURE_OPENAI_WEBHOOK_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-invook-mail}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-invook}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-invook-local-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "import('./apps/api/node_modules/axios/index.js').then(({default:axios})=>axios.get('http://127.0.0.1:4000/health/ready')).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://invook:invook@db:5432/invook}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TASK_QUEUE_PREFIX: ${TEMPORAL_TASK_QUEUE_PREFIX:-}
      TEMPORAL_TENANT_SHARD_COUNT: ${TEMPORAL_TENANT_SHARD_COUNT:-1}
      TEMPORAL_TENANT_SHARD_INDEX: ${TEMPORAL_TENANT_SHARD_INDEX:-0}
      GMAIL_CONTENT_CONCURRENCY: ${GMAIL_CONTENT_CONCURRENCY:-5}
      MAIL_LABEL_CONCURRENCY: ${MAIL_LABEL_CONCURRENCY:-5}
      MAIL_LABEL_HOT_WINDOW_DAYS: ${MAIL_LABEL_HOT_WINDOW_DAYS:-14}
      MAIL_LABEL_HOT_WINDOW_MAX_THREADS: ${MAIL_LABEL_HOT_WINDOW_MAX_THREADS:-1000}
      MAIL_BULK_CONCURRENCY: ${MAIL_BULK_CONCURRENCY:-3}
      GMAIL_GOOGLE_CLIENT_ID: ${GMAIL_GOOGLE_CLIENT_ID:-}
      GMAIL_GOOGLE_CLIENT_SECRET: ${GMAIL_GOOGLE_CLIENT_SECRET:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-invook-mail}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-invook}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-invook-local-secret}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      MEMORY_BATCH_PROVIDER: ${MEMORY_BATCH_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LABEL_BATCH_MODEL: ${OPENAI_LABEL_BATCH_MODEL:-gpt-5.6-luna}
      OPENAI_LABEL_BATCH_INPUT_TOKEN_LIMIT: ${OPENAI_LABEL_BATCH_INPUT_TOKEN_LIMIT:-500000}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_BATCH_DEPLOYMENT: ${AZURE_OPENAI_BATCH_DEPLOYMENT:-}
      AZURE_OPENAI_BATCH_INPUT_TOKEN_LIMIT: ${AZURE_OPENAI_BATCH_INPUT_TOKEN_LIMIT:-}
      AZURE_OPENAI_WEBHOOK_SECRET: ${AZURE_OPENAI_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  invook-postgres:
  invook-minio:
